- {name: riverdetails, code: "import anvil.google.auth, anvil.google.drive, anvil.google.mail\n\
    from anvil.google.drive import app_files\nimport anvil.tables as tables\nimport\
    \ anvil.tables.query as q\nfrom anvil.tables import app_tables\nimport anvil.server\n\
